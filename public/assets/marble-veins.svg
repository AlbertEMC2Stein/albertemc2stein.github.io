<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="marbling" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.0078125 0.015625"
        numOctaves="4"
        seed="17"
        stitchTiles="stitch"
        result="noise"
      />
      <feColorMatrix
        in="noise"
        type="matrix"
        values="0 0 0 0 0.91
                0 0 0 0 0.87
                0 0 0 0 0.78
                1 0 0 0 0"
        result="colored-noise"
      />
      <feComponentTransfer in="colored-noise">
        <feFuncA type="table" tableValues="0 0 0.12 0.40 0.65 0.40 0.12 0 0" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" filter="url(#marbling)" />
</svg>
